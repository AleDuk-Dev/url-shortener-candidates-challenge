services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PUBLIC_URL=http://localhost:3000
      - DATABASE_URL=file:/app/libs/engine/data.db
    volumes:
      - db-data:/app/libs/engine

volumes:
  db-data:
